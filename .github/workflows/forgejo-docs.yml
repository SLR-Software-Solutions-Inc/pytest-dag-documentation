name: Forgejo Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap uv and build docs
        run: |
          set -euxo pipefail

          export HOME="$PWD/.ci-home"
          mkdir -p "${HOME}"
          export UV_INSTALL_DIR="$PWD/.ci-tools/uv"
          mkdir -p "${UV_INSTALL_DIR}"
          export PATH="${UV_INSTALL_DIR}:${HOME}/.local/bin:${PATH}"

          if ! command -v uv >/dev/null 2>&1; then
            if command -v curl >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- https://astral.sh/uv/install.sh | sh
            else
              echo "Could not install uv: neither curl nor wget available." >&2
              exit 1
            fi
          fi

          uv --version
          uv python install 3.12
          uv venv --clear --python 3.12 .ci-venv
          uv pip install --python .ci-venv/bin/python -r docs/requirements.txt
          uv run --python .ci-venv/bin/python sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: sphinx-site-preview
          path: docs/_build/html/
          if-no-files-found: warn
          retention-days: 7

      - name: Trigger Read the Docs build
        env:
          READTHEDOCS_WEBHOOK_URL: ${{ secrets.READTHEDOCS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          export HOME="$PWD/.ci-home"
          export PATH="$PWD/.ci-tools/uv:${HOME}/.local/bin:${PATH}"

          if [ -z "${READTHEDOCS_WEBHOOK_URL}" ]; then
            echo "READTHEDOCS_WEBHOOK_URL not configured; skipping trigger"
            exit 0
          fi
          uv run --python .ci-venv/bin/python python - <<'PY'
          import os, urllib.request
          req = urllib.request.Request(
              os.environ["READTHEDOCS_WEBHOOK_URL"],
              data=b"{}",
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print("Read the Docs trigger status:", r.status)
          PY
