name: Forgejo Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: slr-prod-ci
    # JavaScript actions execute inside the job container, so Node must be present.
    container: node:22-bookworm
    steps:
      - name: Bootstrap uv and build docs
        run: |
          set -euxo pipefail

          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl
            rm -rf /var/lib/apt/lists/*
          fi

          WORKDIR=""
          if [ -f docs/conf.py ]; then
            WORKDIR="$PWD"
          elif [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "${GITHUB_WORKSPACE}/docs/conf.py" ]; then
            WORKDIR="${GITHUB_WORKSPACE}"
          else
            rm -rf repo
            REPO_URL="${GITHUB_SERVER_URL:-https://git.slrsoft.ca}/${GITHUB_REPOSITORY}.git"
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              HOST_PATH="${REPO_URL#https://}"
              git clone --depth=1 "https://oauth2:${GITHUB_TOKEN}@${HOST_PATH}" repo
            else
              git clone --depth=1 "${REPO_URL}" repo
            fi
            WORKDIR="$PWD/repo"
          fi
          cd "${WORKDIR}"
          echo "DOCS_WORKDIR=$WORKDIR" >> "${GITHUB_ENV:-/dev/null}"

          export HOME="$PWD/.ci-home"
          mkdir -p "${HOME}"
          export UV_INSTALL_DIR="$PWD/.ci-tools/uv"
          mkdir -p "${UV_INSTALL_DIR}"
          export PATH="${UV_INSTALL_DIR}:${HOME}/.local/bin:${PATH}"

          if ! command -v uv >/dev/null 2>&1; then
            if command -v curl >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- https://astral.sh/uv/install.sh | sh
            else
              echo "Could not install uv: neither curl nor wget available." >&2
              exit 1
            fi
          fi

          uv --version
          uv python install 3.12
          uv venv --clear --python 3.12 .ci-venv
          uv pip install --python .ci-venv/bin/python -r docs/requirements.txt
          uv run --python .ci-venv/bin/python sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: sphinx-site-preview
          path: docs/_build/html/
          if-no-files-found: warn
          retention-days: 7

      - name: Trigger Read the Docs build
        env:
          READTHEDOCS_WEBHOOK_URL: ${{ secrets.READTHEDOCS_WEBHOOK_URL }}
          READTHEDOCS_WEBHOOK_SECRET: ${{ secrets.READTHEDOCS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          cd "${DOCS_WORKDIR}"
          export HOME="$PWD/.ci-home"
          export PATH="$PWD/.ci-tools/uv:${HOME}/.local/bin:${PATH}"

          case "${READTHEDOCS_WEBHOOK_URL:-}" in
            https://*) ;;
            *) echo "READTHEDOCS_WEBHOOK_URL not configured or invalid; skipping trigger"; exit 0 ;;
          esac
          uv run --python .ci-venv/bin/python scripts/rtd_trigger.py
