name: Docs Preview (Sphinx Build Check)

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Sphinx docs
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'slr-prod-ci' }}
    container: python:3.12-bookworm
    steps:
      - name: Bootstrap uv, install dependencies, and build docs
        run: |
          set -euxo pipefail

          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl
            rm -rf /var/lib/apt/lists/*
          fi

          WORKDIR=""
          if [ -f docs/conf.py ]; then
            WORKDIR="$PWD"
          elif [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "${GITHUB_WORKSPACE}/docs/conf.py" ]; then
            WORKDIR="${GITHUB_WORKSPACE}"
          else
            rm -rf repo
            REPO_URL="${GITHUB_SERVER_URL:-https://git.slrsoft.ca}/${GITHUB_REPOSITORY}.git"
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              HOST_PATH="${REPO_URL#https://}"
              git clone --depth=1 "https://oauth2:${GITHUB_TOKEN}@${HOST_PATH}" repo
            else
              git clone --depth=1 "${REPO_URL}" repo
            fi
            WORKDIR="$PWD/repo"
          fi
          cd "${WORKDIR}"

          export HOME="$PWD/.ci-home"
          mkdir -p "${HOME}"
          export UV_INSTALL_DIR="$PWD/.ci-tools/uv"
          mkdir -p "${UV_INSTALL_DIR}"
          export PATH="${UV_INSTALL_DIR}:${HOME}/.local/bin:${PATH}"

          if ! command -v uv >/dev/null 2>&1; then
            if command -v curl >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- https://astral.sh/uv/install.sh | sh
            else
              echo "Could not install uv: neither curl nor wget available." >&2
              exit 1
            fi
          fi

          uv --version
          uv python install 3.12
          uv venv --clear --python 3.12 .ci-venv
          uv pip install --python .ci-venv/bin/python -r docs/requirements.txt
          uv run --python .ci-venv/bin/python sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload built site artifact (GitHub)
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.server_url == 'https://github.com' }}
        with:
          name: sphinx-site-preview
          path: docs/_build/html/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload built site artifact (Forgejo)
        if: ${{ always() && github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@v3
        with:
          name: sphinx-site-preview
          path: docs/_build/html/
          if-no-files-found: warn
          retention-days: 7
